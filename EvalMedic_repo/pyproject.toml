[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalmedic"
version = "0.1.0"
description = "Diagnosis and maintenance primitives for LLM and agent evaluation systems."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Shuge Lei"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
evalmedic = "evalmedic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

